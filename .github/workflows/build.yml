name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar pasta android
        run: flutter create --platforms=android --org com.riftHelper --project-name wildrift_helper .

      - name: Permissão de internet e nome do app
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#android:label="[^"]*"#android:label="Rift Helper"#' $M

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: rift-helper-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Renomear APK
        run: cp build/app/outputs/flutter-apk/app-release.apk RiftHelper.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rift Helper (build ${{ github.run_number }})
          body: Baixe o RiftHelper.apk abaixo e instale no celular.
          files: RiftHelper.apk
          make_latest: true
